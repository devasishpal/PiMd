[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pimd"
version = "2.2.1"
description = "Professional document publishing platform — Markdown, HTML, diagrams, equations, templates, EPUB, LaTeX, PDF/A, i18n, multi-format export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PiMD Contributors" },
]
keywords = ["markdown", "html", "docx", "epub", "latex", "pdfa", "converter", "document", "publishing", "i18n", "rtl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pidraw>=1.3.2",
    "matplotlib>=3.7.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "typer-cli>=0.12.0",
    "psutil>=5.9.0",
]
diagrams = [
    "Pillow>=10.0.0",
]
equations = [
    "matplotlib>=3.7.0",
]
export = [
    "docx2pdf>=0.1.0; platform_system=='Windows'",
    "weasyprint>=60.0; platform_system!='Windows'",
]
citations = [
    "bibtexparser>=1.4.0",
]
redis = [
    "redis>=5.0.0",
]
profiling = [
    "psutil>=5.9.0",
]
epub = []
latex = []
pdfa = [
    "fpdf2>=2.7.0",
]
i18n = [
    "python-bidi>=0.4.0",
    "arabic_reshaper>=3.0.0",
]
collaboration = []
all = [
    "pimd[diagrams,equations,export,citations,redis,profiling,epub,latex,pdfa,i18n,collaboration]",
]
full = [
    "pimd[all,dev]",
]

[project.urls]
Homepage = "https://github.com/devasishpal/PiMd"
Repository = "https://github.com/devasishpal/PiMd"
Documentation = "https://github.com/devasishpal/PiMd#readme"

[project.scripts]
pimd = "pimd.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pimd"]

[tool.ruff]
line-length = 263
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "from __future__ import annotations",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
