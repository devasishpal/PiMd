[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pimd"
version = "1.0.0"
description = "Professional Markdown and HTML to DOCX conversion framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PiMD Contributors" },
]
keywords = ["markdown", "html", "docx", "converter", "document", "publishing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "markdown-it-py>=3.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "typer-cli>=0.12.0",
    "psutil>=5.9.0",
]
diagrams = [
    "Pillow>=10.0.0",
]
equations = [
    "matplotlib>=3.7.0",
]
export = [
    "docx2pdf>=0.1.0; platform_system=='Windows'",
    "weasyprint>=60.0; platform_system!='Windows'",
]
citations = [
    "bibtexparser>=2.0.0",
]
redis = [
    "redis>=5.0.0",
]
profiling = [
    "psutil>=5.9.0",
]
all = [
    "pimd[dev,diagrams,equations,export,citations,redis,profiling]",
]

[project.urls]
Homepage = "https://github.com/yourname/pimd"
Repository = "https://github.com/yourname/pimd"
Documentation = "https://pimd.readthedocs.io"

[project.scripts]
pimd = "pimd.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pimd"]

[tool.ruff]
line-length = 263
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
