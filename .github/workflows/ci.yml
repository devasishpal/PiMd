name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/ benchmarks/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Type check with mypy (placeholder)
        continue-on-error: true
        run: |
          pip install -e ".[dev]"
          mypy src/ || echo "mypy not fully configured — skipping"

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,diagrams,equations,export,profiling]"

      - name: Run benchmarks
        run: python benchmarks/run_all.py --json --output benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest-cov
          pip install -e ".[dev,diagrams,equations,citations,export,redis,profiling]"

      - name: Test with pytest
        run: python -m pytest tests/ -v --tb=short -x

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=src/ --cov-report=xml --cov-report=html -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Build package
        run: python -m build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pimd-${{ matrix.python-version }}
          path: dist/*.whl
